# pnpm 11+ reads all non-auth settings from pnpm-workspace.yaml (not .npmrc).
# @deepseek-ai/* peers resolve from the npm registry via autoInstallPeers,
# using the auth token in .npmrc. No local link farm.
autoInstallPeers: true
nodeLinker: hoisted

# esbuild's postinstall is blocked by pnpm 10+/11 defaults unless approved;
# tsdown/tsx depend on it, so approve the build script here.
allowBuilds:
  esbuild: true

# Upstream packaging fix (0.1.7-rc.2): the published dsh-client-ui-primitives
# manifest does not declare @deepseek-ai/dsh-util-code-language, while its
# built lib/index.js bare-imports it at runtime (markdown code highlighting;
# the source tree declares it only as a devDependency). Patch the manifest so
# the vitest/dev graph can resolve the import. Remove once the upstream
# published manifest declares the dependency.
packageExtensions:
  '@deepseek-ai/dsh-client-ui-primitives@0.1.7-rc.2':
    dependencies:
      '@deepseek-ai/dsh-util-code-language': ^0.1.7-rc.2

